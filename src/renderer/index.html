<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: blob:; connect-src 'self' blob:;">
  <title>VOID - Vertex Object Interactive Designer</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div id="app">
    <header class="menu-bar">
      <span class="app-title">VOID</span>
      <div class="menu-items">
        <div class="menu-item" data-menu="file">
          <span>File</span>
          <div class="menu-dropdown">
            <div class="menu-dropdown-item" data-action="new">New Scene</div>
            <div class="menu-dropdown-item" data-action="import">Import USD...</div>
            <div class="menu-dropdown-item" data-action="export">Export USD</div>
            <div class="menu-dropdown-divider"></div>
            <div class="menu-dropdown-item" data-action="quit">Quit</div>
          </div>
        </div>
        <div class="menu-item" data-menu="edit">
          <span>Edit</span>
          <div class="menu-dropdown">
            <div class="menu-dropdown-item" data-action="undo">Undo</div>
            <div class="menu-dropdown-item" data-action="redo">Redo</div>
            <div class="menu-dropdown-divider"></div>
            <div class="menu-dropdown-item" data-action="delete">Delete</div>
          </div>
        </div>
        <div class="menu-item" data-menu="view">
          <span>View</span>
          <div class="menu-dropdown">
            <div class="menu-dropdown-item" data-action="reset-camera">Reset Camera</div>
            <div class="menu-dropdown-item" data-action="toggle-grid">Toggle Grid</div>
            <div class="menu-separator"></div>
            <div class="menu-dropdown-item" data-action="skybox-equirectangular">Skybox: Equirectangular...</div>
            <div class="menu-dropdown-item" data-action="skybox-cube">Skybox: Cube...</div>
            <div class="menu-dropdown-item" data-action="skybox-hdr">Skybox: HDR...</div>
            <div class="menu-dropdown-item" data-action="skybox-clear">Skybox: Clear</div>
          </div>
        </div>
        <div class="menu-item" data-menu="help">
          <span>Help</span>
          <div class="menu-dropdown">
            <div class="menu-dropdown-item" data-action="about">About VOID</div>
          </div>
        </div>
      </div>
    </header>
    
    <div class="main-content">
      <aside class="panel scene-tree" id="scene-tree">
        <div class="panel-header">Scene</div>
        <div class="panel-content" id="scene-list">
          <div class="empty-state">No objects</div>
        </div>
      </aside>
      
      <main class="viewport" id="viewport">
        <canvas id="three-canvas"></canvas>
      </main>
      
      <aside class="panel properties" id="properties">
        <div class="panel-header">Properties</div>
        <div class="panel-content" id="properties-content">
          <div class="empty-state">Select an object</div>
        </div>
      </aside>
      
      <aside class="panel uv-editor" id="uv-editor">
        <div class="panel-header">
          <span>UV Editor</span>
          <button class="panel-close" id="uv-editor-close">&times;</button>
        </div>
        <div class="panel-content" id="uv-content">
          <canvas id="uv-canvas"></canvas>
          <div class="uv-toolbar">
            <button class="btn btn-small" id="uv-select-tool" title="Select (V)">S</button>
            <button class="btn btn-small" id="uv-move-tool" title="Move (G)">M</button>
          </div>
        </div>
      </aside>

      <div class="shortcuts-panel" id="shortcuts-panel">
        <div class="panel-header">
          <span>Shortcuts</span>
          <button class="panel-toggle" id="shortcuts-toggle">−</button>
        </div>
        <div class="shortcuts-content" id="shortcuts-content"></div>
      </div>
    </div>
    
    <footer class="command-bar">
      <span class="command-prompt">:</span>
      <input type="text" id="command-input" class="command-input" placeholder="Command..." autocomplete="off">
      <span class="status" id="status">Normal Mode</span>
    </footer>
  </div>
  
  <script type="module" src="./main.js"></script>
</body>
</html>
