name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ============================================
  # Build for Windows
  # ============================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows executable
        run: npm run dist

      - name: Find Windows executable
        id: find-exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter "*.exe" -Recurse | Select-Object -First 1
          "exe-path=$($exe.FullName)", "exe-name=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: ${{ steps.find-exe.outputs.exe-path }}
          retention-days: 90

  # ============================================
  # Build for Linux
  # ============================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Linux AppImage
        run: npm run dist

      - name: Find Linux artifact
        id: find-linux
        run: |
          echo "artifact=$(find release -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' | head -1)" >> $GITHUB_OUTPUT
          echo "name=$(find release -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' | head -1 | xargs basename)" >> $GITHUB_OUTPUT

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: ${{ steps.find-linux.outputs.artifact }}
          retention-days: 90

  # ============================================
  # Build for Web
  # ============================================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist

  # ============================================
  # Create Release
  # ============================================
  create-release:
    name: Create Release
    needs: [build-windows, build-linux, build-web]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-artifact
          path: artifacts/linux

      - name: List artifacts
        run: ls -la artifacts/windows/ artifacts/linux/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows/*.exe
            artifacts/linux/*.AppImage
            artifacts/linux/*.deb
            artifacts/linux/*.rpm
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
